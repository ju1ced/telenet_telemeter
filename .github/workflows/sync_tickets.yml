name: Sync ticket documents

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, labeled, unlabeled, milestoned, demilestoned, transferred]
  milestone:
    types: [created, edited, opened, closed, deleted]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - scripts/sync_tickets.py
      - .github/workflows/sync_tickets.yml
  pull_request:
    paths:
      - scripts/sync_tickets.py
      - tests/test_ticket_sync.py
      - .github/workflows/sync_tickets.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the generator
        run: python3 -m unittest discover -s tests -p test_ticket_sync.py -v
  sync:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    concurrency:
      group: sync-ticket-documents
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_tickets.py --repository "$GITHUB_REPOSITORY"
      - name: Commit changed documents
        run: |
          set -e
          git add tickets.md kanban.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync tickets and sprint board from GitHub'
          git pull --rebase origin main
          git push origin HEAD:main
